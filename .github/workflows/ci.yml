name: CI

# Runs on every pull request and on every push to main.
# Reviewers only start reading a PR once this check is green
# ("automate all possible checks before code review").
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: |
          mkdir -p out
          javac -d out src/*.java test/*.java

      - name: Run tests
        run: java -cp out CodeReviewExTest
